ar(--line);border-radius:10px;background:white;padding:.6rem .8rem}.tabs a[aria-current=page]{background:var(--pale);border-color:var(--blue);color:var(--blue)}.steps{padding-left:1.45rem;margin:.5rem 0}.steps li{padding:.3rem .2rem}.quiz{max-width:890px}.question{margin:.8rem 0}.question h3{line-height:1.45}.option{display:flex;align-items:baseline;gap:.62rem;margin:.43rem 0;padding:.56rem .7rem;border:1px solid var(--line);border-radius:9px;line-height:1.45}.option:has(:checked){border-color:var(--blue);background:var(--pale)}.option input{accent-color:var(--blue);flex:none}.field{display:grid;gap:.28rem;max-width:320px;font-weight:700}.field input,.field select{padding:.53rem;border:1px solid #657890;background:white;border-radius:8px;color:var(--ink);width:100%}.answer-note{display:block;margin:.35rem 0}.feedback{padding:.65rem .8rem;border-left:4px solid var(--blue);background:var(--pale);border-radius:8px;margin:.75rem 0;line-height:1.55}.feedback.good{border-color:var(--green);background:#e7f9eb}.feedback.bad{border-color:var(--error);background:var(--rose)}.score{font-size:2.15rem;font-weight:900;letter-spacing:-.04em}.reorder{display:flex;gap:.5rem;align-items:center;border-bottom:1px solid var(--line);padding:.45rem 0}.reorder span{flex:1}.reorder button{min-width:2.45rem;padding:.28rem .45rem}.lab-controls{display:flex;gap:.8rem;flex-wrap:wrap;margin:.65rem 0}.lab-controls label{display:grid;gap:.26rem;font-weight:750;min-width:112px}.lab-controls input[type=range]{accent-color:var(--blue);max-width:100%}.lab-controls select{padding:.4rem;border-radius:7px;background:white;border:1px solid #657890;color:var(--ink)}.lab-diagram{min-width:0;margin:.9rem 0}.lab-diagram svg{display:block;width:100%;height:auto;border-radius:13px;background:#fbfcff;box-shadow:0 0 0 1px var(--line)}.lab-diagram .pair{display:grid;grid-template-columns:minmax(0,340fr) minmax(0,640fr);gap:.75rem}.diagram-scroll{overflow-x:auto;min-width:0;padding:1px}.diagram-scroll .wide{min-wid <script>
"use strict";
const chapters = [
{
id:"trojuholnik", title:"Pravouhlý trojuholník", label:"POMERY STRÁN", time:20, lab:"triangle",
goal:"Vybrať správny pomer, dopočítať stranu alebo uhol a vysvetliť, prečo pomer nezávisí od veľkosti trojuholníka.",
lead:"Šikmá rampa, rebrík aj výška stromu sa dajú opísať jedným pravouhlým trojuholníkom. Začni označením uhla. Tá istá odvesna môže byť pri jednom uhle protiľahlá a pri druhom priľahlá.",
concepts:[
["Najprv označ referenčný uhol","Prepona leží oproti pravému uhlu a je najdlhšia. Protiľahlá odvesna leží oproti vyznačenému ostrému uhlu α. Priľahlá odvesna s ním susedí a nie je preponou."],
["Tri pomery","sin α = protiľahlá odvesna / prepona. cos α = priľahlá odvesna / prepona. tg α = protiľahlá odvesna / priľahlá odvesna. Podobné trojuholníky majú rovnaké pomery. Pri doplnkovom uhle β = 90° − α sa odvesny vymenia, preto sin β = cos α."],
["Od hodnoty späť k uhlu","Ak poznáš pomer strán, použi inverznú funkciu. Napríklad tg α = 3/4 dá α = arctg(3/4) ≈ 36,87° v režime DEG. Tlačidlo tan⁻¹ znamená arctg. Prevrátenú hodnotu vypočítaš ako 1/tg α."] ],
example:{title:"Rebrík pri stene",prompt:"Rebrík dlhý 5 m je opretý o zvislú stenu a stojí na vodorovnej zemi. Medzi rebríkom a zemou je uhol 60°. Vypočítaj zvislú vzdialenosť od zeme po miesto, kde sa rebrík dotýka steny. Uveď presný výsledok aj približnú hodnotu v metroch na dve desatinné miesta.",steps:["Nakresli pravý uhol medzi zemou a stenou. Rebrík je prepona, výška je odvesna oproti 60°.","Napíš sin 60° = h/5 a vyjadri h.","h = 5·sin 60° = 5√3/2 m ≈ 4,33 m. Výsledok je menší ako dĺžka rebríka."]},
trap:["Zameníš pomer strán, keď sa zmení označený uhol.","Najprv pri každom uhle nanovo označ protiľahlú odvesnu. Prepona ostáva tá istá."],
oral:["Predstav si dva pravouhlé trojuholníky rôznych veľkostí. Oba majú jeden ostrý uhol 35°. Vysvetli, prečo je pomer odvesny oproti tomuto uhlu k odvesne pri ňom rovnaký v oboch trojuholníkoch. Pomenuj goniometrickú funkciu, ktorej hodnotu tento pomer vyjadruje.","Majú zhodné uhly, takže sú podobné. Obe odvesny sa menia tým istým násobkom a ich podiel sa nemení. Tento podiel je tangens uhla 35°."]
},
{
id:"uhly", title:"Orientované uhly a radiány", label:"OTOČENIE", time:23, lab:"turn",
goal:"Prevádzať medzi mierami, chápať radián ako pomer a nájsť uhol základnej veľkosti.",
lead:"Predstav si stopu bodu pri otáčaní kolesa. Stupne aj radiány hovoria o tom istom otočení, iba používajú inú jednotku.",
concepts:[
["Radián z oblúka","Pre neorientovaný oblúk dĺžky s na kružnici s polomerom r platí α = s/r v radiánoch. Pri orientovanom uhle priraď smer a znamienko. Pri otočení o jeden radián je prejdená dĺžka oblúka rovná polomeru."],
["Prevody","Celá otočka má 360° = 2π rad, polovica 180° = π rad. Stupne násob π/180. Radiány násob 180/π. Odhad pomôže: π/2 je 90° a π je 180°."],
["Orientácia a základná veľkosť","Kladný uhol meriame proti smeru hodinových ručičiek, záporný v smere. Na ten istý koncový bod vedú uhly líšiace sa o 2kπ, k ∈ ℤ. Základný uhol vyber z [0; 2π), resp. [0°; 360°). Zachytený oblúk s = r·|α| platí aj pri viacerých otočeniach, ak počítaš celú prejdenú dĺžku."] ],
example:{title:"Uhol −765°",prompt:"Rameno najprv smeruje doprava po kladnej vodorovnej polosi. Otočíme ho o −765°, teda v smere hodinových ručičiek. Nájdi uhol z intervalu [0°; 360°), ktorý pri štarte z rovnakej polohy vedie na to isté koncové rameno. Zapíš ho v stupňoch aj presne v radiánoch.",steps:["Pridaj 2·360°. Dostaneš −45°, čo je ešte mimo [0°; 360°).","Pridaj ďalších 360°. Základný uhol je 315°.","315·π/180 = 7π/4. Koncové rameno leží v IV. kvadrante."]},
trap:["Záporný uhol premeníš na kladný odstránením znamienka.","Použi násobky celej otočky. Uhly −45° a 45° majú rôzne koncové ramená."],
oral:["Predstav si dve kružnice, pričom druhá má dvojnásobný polomer. Na oboch vyznačíme oblúky prislúchajúce rovnakému stredovému uhlu. Porovnaj dĺžky oblúkov a vysvetli, či sa pri zdvojnásobení polomeru zmení radiánová miera uhla.","Dĺžka oblúka sa zdvojnásobí. Pomer s/r, a teda uhol, zostane rovnaký."]
},
{
id:"kruznica", title:"Jednotková kružnica a presné hodnoty", label:"SÚRADNICE", time:28, lab:"circle",
goal:"Odvodiť význačné hodnoty a určiť sínus, kosínus aj tangens ľubovoľného uhla pomocou kvadrantu a referenčného uhla.",
lead:"Otáčaj bod P okolo počiatku. Jeho vodorovná súradnica je kosínus uhla a zvislá sínus. Vďaka tomu majú funkcie zmysel aj mimo ostrých uhlov.",
concepts:[
["Súradnice a znamienka","P = (cos x; sin x). V I. kvadrante sú obe súradnice kladné, v II. je záporný kosínus, v III. sú obe záporné, v IV. je záporný sínus. Tangens je sin x/cos x, ak cos x ≠ 0."],
["Odkiaľ sú odmocniny","Rovnoramenný pravouhlý trojuholník s preponou 1 má odvesny √2/2. Rozdelením rovnostranného trojuholníka so stranou 1 dostaneš odvesny 1/2 a √3/2 pri uhloch 30° a 60°. Hodnoty na osiach odčítaj priamo zo súradníc."],
["Referenčný uhol a súmernosti","Najprv nájdi kvadrant a ostrý uhol k osi x. Z neho získaš absolútnu hodnotu a znamienko doplníš podľa kvadrantu. Na osiach rozhoduje poloha bodu. sin(−x) = −sin x, cos(−x) = cos x, tg(−x) = −tg x, ak je definovaný."] ],
example:{title:"Hodnoty pri 7π/6",prompt:"Na jednotkovej kružnici odmeriame proti smeru hodinových ručičiek uhol 7π/6 radiánu od kladnej vodorovnej polosi. Urči kvadrant koncového bodu a vypočítaj presné hodnoty sínusu, kosínusu a tangensu tohto uhla.",steps:["7π/6 = π + π/6. Bod je v III. kvadrante, referenčný uhol je π/6.","Obe súradnice sú záporné. sin(7π/6) = −1/2 a cos(7π/6) = −√3/2.","Podiel je kladný. tg(7π/6) = 1/√3 = √3/3."]},
trap:["Pri 150° dosadíš hodnoty z 30° vrátane oboch znamienok.","Referenčný uhol určuje iba absolútne hodnoty. V II. kvadrante je sínus kladný a kosínus záporný."],
oral:["Koncový bod uhla π/2 leží hore na jednotkovej kružnici. Vysvetli pomocou jeho vodorovnej a zvislej súradnice, prečo je sin(π/2) = 1, no tg(π/2) nemá definovanú hodnotu.","Tangens je podiel sínusu a kosínusu. V π/2 je kosínus nulový, takže podiel nie je definovaný."]
},
{
id:"vztahy", title:"Vzťahy, identity a úpravy", label:"ZDÔVODŇOVANIE", time:32, lab:"identity",
goal:"Použiť základnú identitu, doplnkové uhly, posuny a dvojnásobný uhol. Kontrolovať znamienka a definičný obor.",
lead:"Väčšina vzťahov sa dá znovu odvodiť z jednotkovej kružnice. Keď upravuješ výraz, najprv si ujasni, pre ktoré argumenty existuje.",
concepts:[
["Pytagorova identita a doplnkové uhly","sin²x + cos²x = 1, lebo P leží na jednotkovej kružnici. Súmernosť podľa priamky y = x dá cos(π/2 − x) = sin x a sin(π/2 − x) = cos x. Posun o π zmení znamienko sínusu aj kosínusu; pri tangense sa obe znamienka vykrátia."],
["Dvojnásobný uhol","sin(2x) = 2 sin x cos x. cos(2x) = cos²x − sin²x = 2cos²x − 1 = 1 − 2sin²x. Štvorec hodnoty sin²x a sínus argumentu sin(2x) sú rôzne veci. Pri x = π/2 dostaneš 1 a 0."],
["Súčtové vzťahy ako odôvodnenie","Otočenie bodu (cos x; sin x) o y dá súradnice cos(x+y) = cos x cos y − sin x sin y a sin(x+y) = sin x cos y + cos x sin y. Dosadením y = x odvodíš vzorce pre dvojnásobný uhol. Dosadením y = π/2 dostaneš cos x = sin(x+π/2)."],
["Rovnosť iba tam, kde má zmysel","Napríklad (1 − cos²x)/sin x = sin x platí iba pre sin x ≠ 0. Pri odmocnení sin²x dostaneš |sin x|. Ak poznáš len jednu hodnotu funkcie a kvadrant nie je určený, uvažuj všetky prípustné znamienka."],
["Rozdiel uhlov a presná hodnota","Súčtový vzorec s druhým argumentom −y a párnosť či nepárnosť dajú sin(x−y) = sin x cos y − cos x sin y a cos(x−y) = cos x cos y + sin x sin y. Napríklad 15° = 45° − 30°, preto sin 15° = (√6 − √2)/4."] ],
example:{title:"Poznáme kosínus a kvadrant",prompt:"Koncové rameno uhla x leží v druhom kvadrante a cos x = −3/5. Urči presné hodnoty sin x, tg x a sin(2x), teda sínus uhla, tangens uhla a sínus jeho dvojnásobku. Zdôvodni výber znamienka pri výpočte sínusu.",steps:["sin²x = 1 − 9/25 = 16/25. V II. kvadrante je sin x kladný, takže sin x = 4/5.","tg x = (4/5)/(−3/5) = −4/3.","sin(2x) = 2·(4/5)·(−3/5) = −24/25."]},
trap:["Z identity rovno odčítaš kladný sínus alebo pri krátení zabudneš na pôvodný menovateľ.","Pri odmocnení urči znamienko z polohy bodu. Pri zlomku zapíš podmienku ešte pred krátením."],
oral:["Na jednotkovej kružnici vyznač bod, ku ktorému vedie rameno uhla x. Potom si predstav, že ho otočíš o ďalších π radiánov. Vysvetli, ako sa zmení jeho zvislá súradnica a prečo z toho vyplýva sin(x+π) = −sin x.","Otočenie o π zobrazí bod na protiľahlý bod. Jeho zvislá súradnica zmení znamienko."]
},
{
id:"grafy", title:"Grafy sínusu, kosínusu a tangensu", label:"VLASTNOSTI FUNKCIÍ", time:32, lab:"graph",
goal:"Načrtnúť tri základné grafy a určiť ich obor, nulové body, najmenšiu periódu, extrémy, monotónnosť a ohraničenosť.",
lead:"Na osi x grafu je uhol. Na osi y je hodnota funkcie. Graf vzniká tak, že pri každom uhle zaznamenáš príslušnú hodnotu z kružnice.",
concepts:[
["Sínus a kosínus","Obe funkcie majú D = ℝ, H = [−1; 1] a najmenšiu kladnú periódu 2π. Sínus je nepárny, kosínus párny. Nuly sin x sú kπ, nuly cos x sú π/2 + kπ. Sínus dosahuje 1 pri π/2 + 2kπ a −1 pri 3π/2 + 2kπ. Kosínus má maximum pri 2kπ a minimum pri π + 2kπ."],
["Monotónnosť","Sínus rastie na [−π/2 + 2kπ; π/2 + 2kπ] a klesá na [π/2 + 2kπ; 3π/2 + 2kπ]. Kosínus klesá na [2kπ; π + 2kπ] a rastie na [π + 2kπ; 2π + 2kπ]. Pre zadaný interval vezmi prieniky s týmito úsekmi."],
["Tangens má vetvy","tg x má D = ℝ ∖ {π/2 + kπ}, H = ℝ, nuly kπ a najmenšiu kladnú periódu π. Je nepárny a rastie na každej vetve (−π/2 + kπ; π/2 + kπ). Na celej vetve je neohraničený. Na uzavretom intervale vnútri vetvy je ohraničený."],
["Asymptoty a perióda","Pri x = π/2 + kπ graf tangensu nemá bod. Ani dva rastúce úseky na opačných stranách asymptoty netvoria jeden rastúci interval. Perióda T musí zachovať definičný obor a spĺňať f(x+T) = f(x) pre každé x z oboru. Rovnaká hodnota v dvoch bodoch sama nestačí."] ],
example:{title:"Kde je tangens ohraničený?",prompt:"Graf tangensu sleduj najprv na uzavretom intervale [0; π/4] a potom na intervale [0; π/2), v ktorom pravý koniec nepatrí do intervalu. Rozhodni, či na každom z nich existuje konečné číslo, ktoré je aspoň také veľké ako všetky hodnoty funkcie. Rozdiel medzi intervalmi zdôvodni.",steps:["Na oboch intervaloch sa pohybuješ v jednej rastúcej vetve.","Na [0; π/4] prejdeš od tg 0 = 0 po tg(π/4) = 1.","Na [0; π/2) sa cos x blíži k nule z kladnej strany, sin x k 1. Tangens teda rastie bez hornej hranice."]},
trap:["Nazveš π periódou sínusu, lebo sin 0 = sin π.","Porovnaj napríklad π/2 a 3π/2. Funkčné hodnoty sú 1 a −1. Perióda musí fungovať pre každé x."],
oral:["Na každom súvislom úseku medzi dvoma susednými asymptotami je tangens rastúci. Posúď, či je rastúci aj na celom svojom definičnom obore. Na zdôvodnenie porovnaj hodnoty tg(π/4) a tg(3π/4), pričom π/4 je menšie ako 3π/4.","Napríklad π/4 < 3π/4, ale tg(π/4) = 1 > −1 = tg(3π/4). Medzi bodmi je asymptota."]
},
{
id:"posuny", title:"Premeny grafov a nulové body", label:"ČÍTANIE PREDPISU", time:36, lab:"transform",
goal:"Rozlíšiť účinok koeficientov a určiť periódu, obor hodnôt, extrémy, obor a priesečníky transformovaných funkcií.",
lead:"Porovnaj 2 sin x so sin(2x). Prvý predpis mení zvislý rozmer, druhý mení vzdialenosť na osi x. Túto dvojicu treba vedieť rozlíšiť z grafu aj z predpisu.",
concepts:[
["Čítaj zvonka aj zvnútra","V zápise A·f(B(x−C)) + D mení A zvislú mierku a pri A < 0 aj znamienko výstupu pred posunom. D je zvislý posun. C je vodorovný posun. B mení vodorovnú mierku, pri B < 0 obráti smer argumentu. Zo zápisu Bx+b najprv vyber B: C = −b/B."],
["Perióda a extrémy","Ak A·B ≠ 0, najmenšia kladná perióda je T₀/|B|. Pre sínus a kosínus je H = [D−|A|; D+|A|]. Pre tangens je H = ℝ a asymptoty určuje B(x−C) = π/2+kπ. Polohy extrémov zisti zo základného argumentu a pri zápornom A vymeň maximum s minimom."],
["Nuly a konštantné prípady","Nulu hľadaj z f(B(x−C)) = −D/A a započítaj iba riešenia z pôvodného oboru. Ak B = 0 a vnútorná konštanta je v obore f, vznikne konštanta na ℝ, ktorá nemá najmenšiu kladnú periódu. Ak A = 0, predpis sa na pôvodnom obore zjednoduší na D; body s nedefinovaným tangensom zostávajú vylúčené. Na takomto dierkovanom obore má konštanta s B ≠ 0 najmenšiu kladnú periódu π/|B|."],
["Náčrt cez body","Načrtni strednú čiaru y = D a vyznač charakteristické argumenty základnej funkcie. Pri sínuse a kosínuse pomáha päť bodov po štvrťperióde. Pri tangense najprv zakresli asymptoty."] ],
example:{title:"Posunutý kosínus",prompt:"Funkcia je daná predpisom y = 2cos(3x − π) − 1. Urči najmenšiu kladnú periódu v radiánoch a zapíš interval všetkých hodnôt y. Potom nájdi súradnice jedného bodu grafu, v ktorom funkcia dosahuje najväčšiu hodnotu.",steps:["3x − π = 3(x − π/3). Vodorovný posun je π/3 doprava.","T = 2π/3. Stredná čiara je y = −1 a amplitúda 2, teda H = [−3; 1].","Maximum je pri argumente 0, napríklad v bode (π/3; 1). Ďalšie maximá sú posunuté o násobky periódy."]},
trap:["Vo výraze sin(2x−π) posunieš graf o π.","Najprv vytkni 2. Argument sa rovná nule pri x = π/2, preto je posun π/2 doprava."],
oral:["Porovnaj grafy funkcií y = sin(2x) a y = 2sin x na intervale [0; 2π). V oboch prípadoch počítaj nuly od 0 vrátane, ale bez 2π. Vysvetli, ako sa zmení graf pri násobení argumentu dvoma a pri násobení funkčnej hodnoty dvoma, a koľko nulových bodov preto vidíš na každom grafe.","sin(2x) vykoná dve periódy a má štyri nuly. Funkcia 2sin x vykoná jednu periódu a má dve nuly. Pravý koniec sa do intervalu nezapočítava."]
}

goal:"Riešiť základné aj upravené rovnice, pracovať s kalkulačkou, počítať korene a overovať úplnosť.",

["Tri základné tvary","Pre |a| ≤ 1 nech α = arcsin a. Riešenia sin x = a sú α + 2kπ alebo π − α + 2kπ. Pre β = arccos a má cos x = a riešenia ±β + 2kπ. Pre γ = arctg a platí tg x = a práve pre x = γ + kπ. Všade k ∈ ℤ. Pri a = ±1 sa dve vetvy sínusu alebo kosínusu zlúčia; pri |a| > 1 tieto dve rovnice riešenie nemajú."],
["Kalkulačka a chýbajúca funkcia","V RAD vypočítaš radiánový argument, v DEG stupňový. Ak máš k dispozícii arcsin, zvyšné dve funkcie prepočítaš cez arccos a = π/2 − arcsin a a arctg a = arcsin(a/√(1+a²)). Ak máš len arccos, použi arcsin a = π/2 − arccos a a potom vzťah pre arctg. Ak máš len arctg, pre |a| < 1 platí arcsin a = arctg(a/√(1−a²)); hodnoty ±1 rieš presne. Ak chýba priamo tangens, použi sin/cos. Inverzné funkcie dávajú hlavné hodnoty, nie všetky korene."],
["Substitúcia a interval","Pri sin(ax+b) = c zaveď t = ax+b. Prenes interval, pri zápornom a sa krajné body vymenia aj s príslušnou otvorenosťou. Nájdi všetky t a vráť sa k x. Pri nelineárnom argumente, napr. cos(x²) = 1, najprv nájdi prípustné t = x², potom rieš x² = t a skontroluj oba korene."],
["Rozklad, podmienky a skúška","Pri súčine nulových činiteľov zjednoť obe vetvy. Pri kvadratickej rovnici v sin x zaveď u = sin x a vyraď hodnoty mimo [−1; 1]. Pri tg x zapíš podmienky pred úpravou. Delenie možnou nulou môže stratiť korene. Umocnenie môže pridať cudzie korene, preto ich over. Rovnicu |sin x| = a pre a ≥ 0 rozdeľ na sin x = a a sin x = −a."],
["Dve rôzne funkcie v jednej rovnici","Napríklad pri sin x = cos x najprv skontroluj cos x = 0. Vtedy má sínus hodnotu ±1, takže rovnica neplatí. Na zvyšnom obore môžeš deliť kosínusom a dostaneš tg x = 1, teda x = π/4 + kπ. Priesečníky grafov ukazujú, prečo riešenia ležia každú polotočku."] ],
example:{title:"Druhá vetva po zmene argumentu",prompt:"Hľadaj všetky uhly x, pri ktorých je kosínus dvojnásobku uhla rovný jednej polovici, teda cos(2x) = 1/2. Uvažuj iba x z intervalu [0; 2π), v ktorom 0 patrí do intervalu a 2π doň nepatrí. Všetky riešenia zapíš presne v radiánoch.",steps:["Zaveď t = 2x. Nový interval je [0; 4π).","V jednej otočke dostaneš t = π/3 a t = 5π/3. Pridaj 2π k obom. Získaš ešte 7π/3 a 11π/3.","Vydeľ všetky hodnoty dvoma. S = {π/6; 5π/6; 7π/6; 11π/6}."]},
trap:["Zapíšeš len hodnotu z kalkulačky alebo posunieš o 2π už po vydelení 2x.","Vyrieš celý argument. Ak prevádzaš všeobecný zápis späť na x, deľ aj periodický člen."],
oral:["Spolužiak pri rovnici 2 sin x + tg x = 0 navrhuje vydeliť obe strany výrazom sin x. Vysvetli, ktoré hodnoty x treba vylúčiť kvôli tangensu, prečo by delenie mohlo stratiť platný koreň a ktorou úpravou sa tomu dá predísť.","Mohla by sa stratiť vetva sin x = 0. Najprv vylúč cos x = 0, potom prepíš tg a vyber sin x pred zátvorku."]

concepts:[

["Zátvorky a zadanie","Pri ≤ alebo ≥ môže byť bod rovnosti zahrnutý, ak leží v zadanom intervale a definičnom obore. Pri < alebo > ho vylúč. Oblúk cez začiatok otočky môže dať dva intervaly. Pri riešení v ℝ posúvaj celé intervaly o príslušnú periódu."],

["Mimo oboru hodnôt a úpravy","Pre sin a cos sú hranice ±1. Napríklad cos x > 1 nemá riešenie, cos x ≤ 1 platí pre všetky x. Pri delení záporným číslom obráť smer nerovnosti. Ak násobíš výrazom s neznámym znamienkom, rozlíš prípady alebo zostroj tabuľku znamienok."],
["Súčin, podiel a sústava","Pre sin x·cos x ≥ 0 na [0; 2π) vyhovujú I. a III. kvadrant aj hraničné body v zadanom intervale. Vyjde [0; π/2] ∪ [π; 3π/2]. Pri podiele sin x/cos x ≥ 0 vylúč body π/2 a 3π/2. Pri sústave sin x ≥ 0 a cos x ≥ 0 hľadaj prienik podmienok. Vyjde [0; π/2]."] ],
example:{title:"Oblúk cez začiatok otočky",prompt:"Na jednotkovej kružnici hľadaj uhly, pri ktorých je vodorovná súradnica koncového bodu väčšia než √2/2, teda cos x > √2/2. Rieš iba na intervale [0; 2π). Zapíš všetky vyhovujúce uhly pomocou intervalov s presnými hranicami v radiánoch a rozhodni, ktoré krajné body do nich patria.",steps:["Hranice rovnosti sú π/4 a 7π/4. Na kružnici sleduj vodorovnú súradnicu.","Skús x = 0. Platí 1 > √2/2, takže hľadaný oblúk prechádza nulou.","S = [0; π/4) ∪ (7π/4; 2π). Nula patrí do riešenia. Pravý koniec 2π je v zadaní vylúčený."]},

oral:["Pre reálne číslo a medzi −1 a 1 porovnaj nerovnice cos x > a a cos x ≥ a na intervale [0; 2π). Vysvetli, ktoré uhly sa do množiny riešení pridajú pri prechode od ostrej nerovnosti k neostrej.","Pribudnú hraničné body, v ktorých cos x = a, ak patria do zadaného intervalu."]

concepts:[

["Kosínusová veta","c² = a² + b² − 2ab cos γ. Použi ju pri dvoch stranách a uhle medzi nimi alebo pri troch stranách. Pri hľadaní uhla vyjadri cos γ a použi arccos v intervale (0°; 180°). Pre γ = 90° sa vzorec zmení na Pytagorovu vetu."],

example:{title:"Dve strany a uhol medzi nimi",prompt:"V trojuholníku ABC má strana a dĺžku 7 cm a strana b dĺžku 5 cm. Uhol γ medzi nimi meria 60°. Vypočítaj dĺžku strany c v centimetroch a obsah trojuholníka v štvorcových centimetroch. Oba výsledky zapíš presne aj približne na dve desatinné miesta.",steps:["Použi kosínusovú vetu. c² = 49 + 25 − 2·7·5·(1/2) = 39.","c = √39 cm ≈ 6,24 cm. Použi kladnú odmocninu, lebo počítaš dĺžku.","S = (7·5·sin 60°)/2 = 35√3/4 cm² ≈ 15,16 cm²."]},

["Periodický model","Pri pravidelnom otáčaní opisuj výšku funkciou h(t) = D + A cos(2πt/T + φ) alebo sínusom. T je čas jedného cyklu, D je výška stredu, |A| je najväčšia odchýlka od stredu. Začiatočná poloha určí fázu φ. Riešenie nerovnice potom prelož späť na čas."],

const gcd = (a,b) => b ? gcd(b,a%b) : a;
function angleText(n) {
  if (!n) return "0";
  const g=gcd(Math.abs(n),12), p=Math.abs(n)/g, q=12/g;
  return (n<0?"−":"")+(p===1?"":p)+"π"+(q===1?"":"/"+q);
}
function atom(s) {
  const chars=s.match(/√\d+|\d+(?:[,.]\d+)?|./gu) || [];
  return chars.map(c=> c.startsWith("√") ? '<msqrt><mn>'+esc(c.slice(1))+'</mn></msqrt>' :
    /^\d/.test(c) ? '<mn>'+esc(c)+'</mn>' :
    /^[πa-z]$/i.test(c) ? '<mi>'+esc(c)+'</mi>' : '<mo>'+esc(c)+'</mo>').join("");
}
function rich(s) {
  const safe=esc(s);
  return safe.replace(/(?:[−+-]?(?:(?:\d+)?(?:π|√\d+)|\d+))\s*\/\s*(?:\d+|√\d+)|(?:\d+)?√\d+/gu, match=>{
    const parts=match.split("/").map(p=>p.trim());
    const inner=parts.length===2 ? '<mfrac><mrow>'+atom(parts[0])+'</mrow><mrow>'+atom(parts[1])+'</mrow></mfrac>' : atom(parts[0]);
    return '<math aria-label="'+esc(match)+'">'+inner+'</math>';
  });
}

function curve(f,lo,hi,X,Y,low,high) {
  let d="",prev=null;
  for(let i=0;i<=720;i++){
    const x=lo+(hi-lo)*i/720, v=f(x);
    if(!Number.isFinite(v)||v<low||v>high){prev=null;continue;}
    d+=(prev===null||Math.abs(prev-v)>(high-low)*.47?"M":"L")+X(x).toFixed(2)+" "+Y(v).toFixed(2)+" ";
    prev=v;
  }
  return d;

  const step=model?Math.max(1,Math.ceil(high/5)):1;

  if(threshold!==undefined&&threshold>=low&&threshold<=high)s+=line(left,Y(threshold),right,Y(threshold),colors.point,1.8,"6 4");
  if(other)s+=path(curve(other,lo,hi,X,Y,low,high),"#7d8b9d",1.8);
  s+=path(curve(f,lo,hi,X,Y,low,high),colors.main);
  if(selected!==undefined){

function labSetup(id,root){
  const [title,intro,steps]=labInfo[id];
  const phaseKeys='<div class="angle-key" data-extra="angles" aria-label="Význačné uhly">'+circleTicks.map(n=>'<button type="button" class="btn secondary" data-angle="'+n+'" aria-label="'+n*15+' stupňov">'+rich(angleText(n))+'</button>').join("")+'</div>';
  const controls={
    triangle:()=>range("angle","Uhol pri A (°)",10,80,35)+range("hyp","Prepona (cm)",4,16,9)+select("ref","Referenčný uhol",[["a","Pri A"],["b","Pri B"]]),
    turn:()=>range("n","Otočenie (po 15°)",-48,48,4)+range("radius","Polomer (cm)",1,8,3),
    circle:degreeAngle,
    identity:()=>degreeAngle()+select("relation","Vzťah",[["sum","sin² x + cos² x"],["double","sin 2x"],["parity","sin(−x), cos(−x)"],["tan","tg x = sin x/cos x"]]),
    graph:()=>functionSelect()+degreeAngle(),
    transform:()=>functionSelect()+range("a","A",-3,3,1)+range("b","B",-3,3,1)+range("c","C v násobkoch π/12",-12,12,0)+range("d","D",-2,2,0,.5),
    equation:()=>functionSelect()+select("v","Pravá strana",[["0.5","1/2"],["0","0"],["0.7071067811865476","√2/2"],["0.8660254037844386","√3/2"],["1","1"],["-0.5","−1/2"],["2","2"]])+range("b","B v argumente Bx",1,3,1),
    inequality:()=>select("case","Nerovnica",[["0","sin x ≥ √3/2"],["1","cos x < −√2/2"],["2","sin x > 1/2"],["3","cos x ≥ 1/2"],["4","tg x > 1"]]),
    ssa:()=>range("angle","Uhol α (°)",15,135,30)+range("a","Strana a (cm)",2,14,8)+range("b","Strana b (cm)",2,14,10),
    model:()=>range("r","Polomer (m)",2,15,6)+range("d","Výška stredu nad polomerom (m)",0,10,2)+range("t","Perióda (s)",6,36,12)+range("p","Uplynutá časť otáčky (%)",0,100,25)+select("start","Začiatočná poloha",[["1","Hore"],["-1","Dole"]])
  }[id]();
  const phase=["circle","identity","graph"].includes(id);
  const instructions='<p class="task-text">'+rich(intro)+'</p><h3>Čo urobíš</h3><ol class="steps task-steps">'+steps.map(step=>'<li>'+rich(step)+'</li>').join("")+'</ol>';
  root.innerHTML='<p class="eyebrow">INTERAKTÍVNA DIELŇA</p><h2>'+title+'</h2>'+instructions+'<div class="lab-controls">'+controls+'</div>'+
    (phase?phaseKeys:"")+'<div class="lab-diagram" data-view></div><div class="lab-output" data-output></div><div data-actions></div>'+
    (phase?valueTable():"");
  const fields=Array.from(root.querySelectorAll("[data-control]"));
  const view=root.querySelector("[data-view]"), output=root.querySelector("[data-output]"), actions=root.querySelector("[data-actions]");
  const state={reveal:false,sectors:new Set(),ends:new Set(),checked:false};
  const angleInput=fields.find(el=>el.dataset.control==="n");
  function update(){
    const v=Object.fromEntries(fields.map(el=>[el.dataset.control,el.type==="range"?Number(el.value):el.value]));
    root.querySelectorAll("[data-angle]").forEach(el=>el.setAttribute("aria-pressed",String(Number(el.dataset.angle)===v.n)));
    const [diagram,summary,tools=""]=labFrames[id](v,state);
    view.innerHTML=diagram;
    output.innerHTML=summary;
    if(actions.innerHTML!==tools)actions.innerHTML=tools;
  }
  root.addEventListener("input",()=>{
    state.reveal=false;state.sectors.clear();state.ends.clear();state.checked=false;update();
  });
  root.addEventListener("click",event=>{
    const b=event.target.closest("button"); if(!b)return;
    if(b.dataset.angle!==undefined)angleInput.value=b.dataset.angle;
    if(b.dataset.action==="reveal")state.reveal=!state.reveal;
    if(b.dataset.action==="check")state.checked=true;
    for(const [key,set] of [["sector",state.sectors],["end",state.ends]]){
      if(b.dataset[key]!==undefined){
        const k=Number(b.dataset[key]); if(set.has(k))set.delete(k);else set.add(k);
        state.checked=false;
      }
    }
    const focus=[...b.attributes].find(attr=>["data-action","data-sector","data-end"].includes(attr.name));
    update();
    if(focus)actions.querySelector("["+focus.name+'="'+focus.value+'"]')?.focus({preventScroll:true});
  });
  if(phase){
    view.classList.add("drag-angle");
    let pointer=null;
    function rotate(event){
      const svg=view.querySelector(".circle-panel svg");
      const point=svg.createSVGPoint();
      const matrix=svg.getScreenCTM();
      if(!matrix)return;
      point.x=event.clientX;
      point.y=event.clientY;
      const p=point.matrixTransform(matrix.inverse()), dx=p.x-170, dy=132-p.y;
      if(Math.hypot(dx,dy)<16)return;
      const angle=(Math.atan2(dy,dx)+2*PI)%(2*PI);
      angleInput.value=String(Math.round(angle*12/PI));
      update();
    }
    view.addEventListener("pointerdown",event=>{
      if(!event.isPrimary||event.button!==0||!event.target.closest(".circle-panel svg"))return;
      pointer=event.pointerId;
      view.setPointerCapture(pointer);
      rotate(event);
    });
    view.addEventListener("pointermove",event=>{if(event.pointerId===pointer)rotate(event);});
    view.addEventListener("lostpointercapture",()=>{pointer=null;});
  }
  update();
}
const asymptotes = (b=1,c=0) => Array.from({length:25},(_,i)=>c+(PI/2+(i-12)*PI)/b);
const paired = (n,kind) => '<div class="pair">'+circle(n,{kind})+plot({f:fn[kind],selected:n*PI/12,asym:kind==="tg"?asymptotes():[],label:"Graf funkcie "+kind+" prepojený s jednotkovou kružnicou"})+'</div>';
const trigReadout = n => rich("x = "+angleText(n)+" rad ("+(n*15)+"°) · sin x = "+exactValue(fn.sin(n*PI/12))+" · cos x = "+exactValue(fn.cos(n*PI/12))+" · tg x = "+exactValue(fn.tg(n*PI/12)));
function roots(kind,v,b){
  if(kind!=="tg"&&Math.abs(v)>1)return [];
  const a=kind==="sin"?Math.asin(v):kind==="cos"?Math.acos(v):Math.atan(v);
  const base=kind==="sin"?[a,PI-a]:kind==="cos"?[a,-a]:[a], p=kind==="tg"?PI:2*PI;
  const result=[];
  for(const alpha of base)for(let k=-2;k<=2*b+2;k++){
    const x=(alpha+k*p)/b;
    if(x>=-1e-8&&x<2*PI-1e-8&&!result.some(y=>Math.abs(y-x)<1e-8))result.push(Math.max(0,x));
  }
  return result.sort((a,b)=>a-b);
}
function rootText(x){
  const p=Math.round(x*72/PI), g=gcd(p,72), top=p/g, bottom=72/g;
  if(Math.abs(x-p*PI/72)>1e-8)return "≈ "+dec(x,5);
  if(!p)return "0";
  return (top===1?"":top)+"π"+(bottom===1?"":"/"+bottom);
}
const inequalityCases=[
  {edges:[0,4,8,24],s:[1],ends:[1,2],solution:"[π/3; 2π/3]"},
  {edges:[0,9,15,24],s:[1],ends:[],solution:"(3π/4; 5π/4)"},
  {edges:[0,2,10,24],s:[1],ends:[],solution:"(π/6; 5π/6)"},
  {edges:[0,4,20,24],s:[0,2],ends:[0,1,2],solution:"[0; π/3] ∪ [5π/3; 2π)"},
  {edges:[0,3,6,15,18,24],s:[1,3],ends:[],solution:"(π/4; π/2) ∪ (5π/4; 3π/2)"}
];
const labFrames={
  triangle({angle,hyp,ref}){
    const a=angle*PI/180, factor=12*hyp, A=[45,228], B=[45+factor*Math.cos(a),228-factor*Math.sin(a)], C=[B[0],228], atA=ref==="a", x=atA?a:PI/2-a;
    let s=path("M"+A.join(" ")+" L"+B.join(" ")+" L"+C.join(" ")+" Z",colors.main,3,"#e9edff");
    s+=path("M"+(C[0]-9)+" 228 v-9 h9",colors.axis,1.2);
    s+=dot(...(atA?A:B),5,colors.point)+svgText(A[0]-13,A[1]+6,"A")+svgText(B[0]+13,B[1]-4,"B")+svgText(C[0]+12,C[1]+13,"C");
    return [labSvg(300,264,"Pravouhlý trojuholník; zvýraznený je referenčný uhol",s),
      "Referenčný uhol "+(atA?angle:90-angle)+"° · protiľahlá "+dec(hyp*Math.sin(x))+" cm · priľahlá "+dec(hyp*Math.cos(x))+" cm · prepona "+hyp+" cm<br>sin ≈ "+dec(Math.sin(x))+" · cos ≈ "+dec(Math.cos(x))+" · tg ≈ "+dec(Math.tan(x))];
  },
  turn({n,radius}){
    const x=n*PI/12, r=27+radius*7, cx=149,cy=131;
    let s=dot(cx,cy,r,"none",colors.axis)+line(cx,cy,cx+r,cy,colors.axis,1.6);
    let d="M"+(cx+r)+" "+cy;

  transform({kind,a,b,c,d}){

function parseNumber(s) {
  const raw=s.trim().toLowerCase().replace(/[−–]/g,"-").replace(/[·×]/g,"*").replace(/÷/g,"/").replace(/,/g,".").replace(/\s+/g,"");
  if(!raw||raw.length>100)return NaN;
  const tokens=raw.match(/sqrt|pi|π|√|\d+(?:\.\d+)?|\.\d+|[-+*/()]/g);
  if(!tokens||tokens.join("")!==raw)return NaN;
  let i=0;
  function unary(){
    const t=tokens[i++];
    if(t==="-")return -unary();
    if(t==="+")return unary();
    if(t==="sqrt"||t==="√")return Math.sqrt(unary());
    if(t==="("){
      const result=sum();
      return tokens[i++]===")"?result:NaN;
    }
    if(t==="π"||t==="pi")return PI;
    return t!==undefined&&/^\d|^\.\d/.test(t)?Number(t):NaN;
  }
  function product(){
    let value=unary();
    while(i<tokens.length){
      const t=tokens[i];
      if(t==="*"||t==="/"){
        i++;const right=unary();value=t==="*"?value*right:value/right;
      }else if(["(","π","pi","√","sqrt"].includes(t)){
        value*=unary();
      }else break;
    }
    return value;
  }
  function sum(){
    let value=product();
    while(tokens[i]==="+"||tokens[i]==="-"){
      const t=tokens[i++], right=product();
      value+=t==="+"?right:-right;
    }
    return value;
  }
  const value=sum();
  return i===tokens.length&&Number.isFinite(value)?value:NaN;
}
function shuffled(list){
  const items=list.slice();
  for(let i=items.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [items[i],items[j]]=[items[j],items[i]];
  }
  return items;
}
function quiz(c,part){

      if(!q.options)return [];
      const indexes=q.options.map((_,i)=>i);

      return order;
    });
    const keys=questions.map((q,i)=>{
      const name="q"+i;
      if(q.type==="number"){
        return '<label class="field">Tvoja odpoveď<input type="text" autocomplete="off" maxlength="100" inputmode="text" name="'+name+'" aria-describedby="hint'+i+'"></label><small class="answer-note" id="hint'+i+'">'+(q.format==="decimal"?"Zadaj desatinné číslo bez jednotky. Bodka aj čiarka fungujú.":"Zadaj hodnotu bez jednotky. Pre π použi aj pi, pre odmocninu napríklad sqrt(2).")+'</small>';

      if(q.type==="order")return '<p class="mini">Presúvaj kroky šípkami. Po zoradení označ, že je postup pripravený.</p><div data-order="'+i+'"></div><label class="option"><input type="checkbox" name="'+name+'" value="ok"> Poradie je pripravené</label>';

        orders[i].map(j=>'<label class="option"><input type="'+(q.type==="many"?"checkbox":"radio")+'" name="'+name+'" value="'+j+'"><span>'+rich(q.options[j])+'</span></label>').join("")+'</div>';
    });
    el.innerHTML='<h2>'+(practice?"Tréning so spätnou väzbou":"Test kapitoly")+'</h2><form novalidate><p>'+ (practice?"Dve krátke úlohy. Odpoveď si môžeš hneď overiť.":"Päť úloh. Každá je za jeden bod. Vyhodnotenie sa zobrazí po odovzdaní všetkých odpovedí.")+'</p>'+
      questions.map((q,i)=>'<article class="card question" aria-labelledby="question'+i+'" aria-describedby="prompt'+i+'"><h3 id="question'+i+'">Úloha '+(i+1)+'</h3><p class="task-text" id="prompt'+i+'">'+rich(q.prompt)+'</p>'+keys[i]+(practice?'<button class="btn secondary" type="button" data-practice="'+i+'">Over odpoveď</button>':'')+'<div data-feedback="'+i+'" aria-live="polite"></div></article>').join("")+
      (practice?'<div class="row">'+btn(lessonHref(c,"test"),"Začni test kapitoly")+'</div>':'<button type="submit" class="btn">Odovzdaj test</button><p class="mini" data-status role="status"></p>')+'</form><div data-result tabindex="-1" class="focus-target"></div>';
    const form=el.querySelector("form");

    }

    function assess(i,data){
      const q=questions[i], key="q"+i, raw=data.get(key);

        const wrongFormat=q.format==="decimal"?!/^[+−-]?\d+[,.]\d{2}$/.test(raw.trim()):(/[π√]|pi|sqrt/.test(answer)&&!/[π√]|pi|sqrt/i.test(raw));
        return {ok:!wrongFormat&&Math.abs(value-q.value)<=q.tol,answer,hint:wrongFormat?(q.format==="decimal"?"Zápis má mať presne dve desatinné miesta.":"Zadanie vyžaduje presnú hodnotu so symbolom π alebo odmocninou."):""};
      }

    }

          form.querySelector('[data-move="'+i+'"][data-index="'+newIndex+'"]:not(:disabled)');
        moved?.focus({preventScroll:true});
      }
      if(b.dataset.practice!==undefined){
        const i=Number(b.dataset.practice);
        show(i,assess(i,new FormData(form)));
      }
    });
    form.addEventListener("submit",e=>{
      e.preventDefault();
      if(practice)return;

      if(missing!==-1){
        form.querySelector("[data-status]").textContent="Doplň úlohu "+(missing+1)+". "+grades[missing].hint;
        form.querySelector('[name="q'+missing+'"]').focus();

      }
      grades.forEach((g,i)=>show(i,g));
      const score=grades.filter(g=>g.ok).length;
      progressData[c.id]=Math.max(saved(c.id),score);
      try{localStorage.setItem(storageKey,JSON.stringify(progressData));}catch{}
      form.querySelectorAll("button,input").forEach(control=>control.disabled=true);
      form.querySelector("[data-status]").textContent="";
      const next=chapters[chapterPosition(c)], result=el.querySelector("[data-result]");
      result.innerHTML='<section class="section card '+(score>=4?"worked":"callout")+'"><h2>Výsledok kapitoly</h2><p class="score">'+score+'/5</p><p>'+
        (score>=4?"Máš zvládnutú väčšinu zručností tejto kapitoly. Prejdi si vysvetlenia a pokračuj.":"Pozri si vysvetlenia pri odpovediach. Potom si zopakuj dielňu alebo tréning.")+
        '</p><div class="row"><button type="button" class="btn secondary" data-again>Zopakuj test</button>'+btn(lessonHref(c),"Otvor výklad",true)+(next?btn(lessonHref(next),"Ďalšia kapitola"):btn("#pokrok","Pozri svoj pokrok"))+'</div></section>';
      result.querySelector("[data-again]").addEventListener("click",()=>{start();el.focus();});
      result.focus();

  }

}

    if(tab)quiz(c,tab);else labSetup(c.lab,document.getElementById("lab"));
  }else{
    const pages={uvod:home,kapitoly:overview,pokrok:progressPage,zdroje:sources};
    main.innerHTML=(Object.hasOwn(pages,raw)?pages[raw]:home)();
  }
}
window.addEventListener("hashchange",()=>{render();main.focus();window.scrollTo(0,0);});
render();

</script>
</body>
</html>
