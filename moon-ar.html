let stage=0, timer;
function start(){viewer.setAttribute('src',nasa);viewer.setAttribute('ios-src',nasaIOS);timer=setTimeout(fallback,25000);}
function fallback(){if(stage!==0)return;stage=1;clearTimeout(timer);viewer.removeAttribute('ios-src');source.textContent='Illustrative fallback · crater locations are not geographically accurate';status.textContent='Loading lightweight fallback…';if(location.protocol==='https:'||location.protocol==='http:'){viewer.setAttribute('src',new URL('moon.glb',location.href).href);}else{stage=2;viewer.setAttribute('src',embedded);}}
viewer.addEventListener('error',()=>{if(stage===0)fallback();else if(stage===1){stage=2;viewer.setAttribute('src',embedded);}else status.textContent='Unable to load the 3D model. Try Chrome or Safari.';});
viewer.addEventListener('load',()=>{clearTimeout(timer);status.textContent=viewer.canActivateAR?'Ready · tap View in AR':'3D ready · AR needs a supported device and secure webpage.';});
viewer.addEventListener('ar-status',e=>{if(e.detail.status==='failed')status.textContent='AR could not start. Open this page in a supported mobile browser over HTTPS.';else if(e.detail.status==='not-presenting')status.textContent='3D ready.';else if(e.detail.status==='session-started')status.textContent='Move your device to find a surface.';});
setTimeout(()=>{if(!customElements.get('model-viewer'))status.textContent='3D library could not load. Check your internet connection.';},12000);
customElements.whenDefined('model-viewer').then(start);
</script></body></html>
